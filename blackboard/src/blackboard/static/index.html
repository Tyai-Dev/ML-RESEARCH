<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blackboard</title>
<style>
  :root {
    --slate: #1d2420; --slate-2: #181e1a; --slate-3: #222923; --slate-4: #232a25;
    --edge: #2c342e; --edge-soft: #38423a;
    --chalk: #e8e4d8; --chalk-dim: #b7bfab; --chalk-faint: #8b957f; --chalk-ghost: #6e7a64;
    --amber: #e0b64f; --blue: #9fc6e8; --green: #b8d99a; --red: #e08a7a;
    --serif: Georgia, "Times New Roman", serif;
    --mono: ui-monospace, Consolas, "Cascadia Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--slate); color: var(--chalk);
    font: 14px/1.5 system-ui, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  button { font: inherit; cursor: pointer; }
  ::selection { background: rgba(224,182,79,.28); }

  /* top bar */
  header {
    display: flex; align-items: center; gap: 14px;
    background: var(--slate-2); border-bottom: 1px solid var(--edge);
    padding: 8px 16px; flex: none;
  }
  header .brand { font: 600 15px/1 var(--serif); letter-spacing: .02em; }
  header .brand i { color: var(--amber); font-style: normal; }
  header nav { display: flex; gap: 2px; }
  header nav button {
    background: none; border: 0; color: var(--chalk-faint);
    font: 600 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase;
    padding: 7px 12px; border-bottom: 2px solid transparent;
  }
  header nav button.on { color: var(--amber); border-bottom-color: var(--amber); }
  header .path { font: 11.5px/1 var(--mono); color: var(--chalk-faint); flex: 1; }
  #savestate { font: 10.5px/1 var(--mono); color: var(--chalk-ghost); }
  #savestate.dirty { color: var(--amber); }
  .btn {
    background: none; border: 1px solid var(--edge-soft); color: var(--chalk-dim);
    border-radius: 6px; padding: 6px 12px; font-size: 12px;
  }
  .btn:hover, .btn:focus-visible { color: var(--chalk); border-color: var(--chalk-faint); outline: none; }
  .btn.amber { color: var(--amber); border-color: #574a24; }
  .btn.amber:hover { border-color: var(--amber); }
  #kstate { font: 11px/1 var(--mono); color: var(--chalk-ghost); }
  #kstate.busy { color: var(--amber); }

  /* layout */
  main { flex: 1; display: grid; grid-template-columns: 210px 1fr 420px; min-height: 0; }

  /* files rail */
  #rail {
    background: var(--slate-2); border-right: 1px solid var(--edge);
    overflow-y: auto; padding: 14px 0; font: 12.5px/1.9 var(--mono);
  }
  #rail .hd {
    font: 600 10.5px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase;
    color: var(--chalk-faint); padding: 10px 16px 6px;
  }
  #rail .node { color: var(--chalk-dim); padding: 1px 16px; cursor: pointer; white-space: nowrap;
                overflow: hidden; text-overflow: ellipsis; }
  #rail .node:hover { color: var(--chalk); }
  #rail .node.dir { color: var(--chalk-ghost); }
  #rail .node.on {
    color: var(--chalk); background: var(--slate-3);
    border-left: 2px solid var(--amber); padding-left: 14px;
  }

  /* board (cells) */
  #board { overflow-y: auto; padding: 20px 26px 80px; display: flex; flex-direction: column; gap: 12px; }
  .cell { background: var(--slate-3); border: 1px solid var(--edge); border-radius: 8px; overflow: hidden; }
  .cell.running { border-color: #574a24; }
  .cell .head { display: flex; align-items: center; gap: 8px; padding: 4px 10px;
                border-bottom: 1px solid var(--edge); }
  .cell .head .tag { font: 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase;
                     color: var(--chalk-ghost); flex: 1; }
  .cell .head button { background: none; border: 0; color: var(--chalk-ghost); font-size: 11px; padding: 3px 6px; }
  .cell .head button:hover { color: var(--amber); }
  .cell textarea {
    width: 100%; background: none; border: 0; resize: none; color: var(--chalk);
    font: 13px/1.65 var(--mono); padding: 12px 14px; outline: none; display: block;
  }
  .cell.md textarea { font: italic 15px/1.55 var(--serif); color: #d6d0bd; }
  .cell .out {
    border-top: 1px dashed var(--edge-soft); background: #1e2520;
    padding: 10px 14px; font: 12.5px/1.6 var(--mono); color: #d9d3c0;
    white-space: pre-wrap; overflow-x: auto;
  }
  .cell .out.err { color: var(--red); }
  .cell .out img { max-width: 100%; background: #fdfcf6; border-radius: 4px; margin: 6px 0; }
  .cell .diag { border-top: 1px dashed var(--edge-soft); padding: 6px 14px;
                font: 11px/1.6 var(--mono); color: var(--chalk-faint); }
  .cell .diag b { color: var(--amber); font-weight: 600; }

  /* assistant */
  #chatview { display: none; flex-direction: column; min-height: 0; overflow: hidden; }
  #chatlog { flex: 1; overflow-y: auto; padding: 20px 26px; display: flex;
             flex-direction: column; gap: 14px; }
  .msg { max-width: 92%; border-radius: 10px; padding: 10px 14px; font-size: 13.5px; line-height: 1.6; }
  .msg.user { align-self: flex-end; background: #2a3a30; color: var(--chalk);
              border: 1px solid #34473b; white-space: pre-wrap; }
  .msg.assistant { align-self: flex-start; background: var(--slate-3);
                   border: 1px solid var(--edge); color: var(--chalk); }
  .msg.assistant .txt { white-space: pre-wrap; }
  .msg.assistant .codeblock { background: #1e2520; border: 1px solid var(--edge-soft);
                              border-radius: 6px; margin: 8px 0; overflow: hidden; }
  .msg.assistant .codeblock pre { margin: 0; padding: 10px 12px; font: 12.5px/1.6 var(--mono);
                                  color: #d9d3c0; overflow-x: auto; }
  .msg.assistant .codeblock .cbbar { display: flex; gap: 8px; align-items: center;
      border-top: 1px dashed var(--edge-soft); padding: 4px 10px; }
  .msg.assistant .codeblock .cbbar .lang { font: 10px/1 var(--mono); letter-spacing: .1em;
      text-transform: uppercase; color: var(--chalk-ghost); flex: 1; }
  .msg.assistant .codeblock .cbbar button { background: none; border: 0;
      color: var(--chalk-faint); font-size: 11px; padding: 3px 6px; }
  .msg.assistant .codeblock .cbbar button:hover { color: var(--amber); }
  .msg.err { align-self: center; color: var(--red); font: 12px/1.5 var(--mono);
             background: none; border: 0; }
  #chatbar { flex: none; display: flex; gap: 10px; align-items: flex-end;
             border-top: 1px solid var(--edge); padding: 12px 16px; }
  #chatbar textarea { flex: 1; background: var(--slate-3); border: 1px solid var(--edge);
      border-radius: 8px; color: var(--chalk); font: 13px/1.5 var(--mono);
      padding: 10px 12px; resize: none; outline: none; max-height: 180px; }
  #chatbar textarea:focus { border-color: var(--chalk-faint); }
  #chatbar label { font: 11px/1.4 var(--mono); color: var(--chalk-faint);
                   display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  .addrow { display: flex; gap: 10px; justify-content: center; padding-top: 6px; }
  .addrow .btn { font-size: 11.5px; }

  /* theory board */
  #theory { background: var(--slate-4); border-left: 1px solid var(--edge);
            display: flex; flex-direction: column; min-height: 0; }
  #theory .tabs { display: flex; gap: 2px; padding: 10px 14px 0; border-bottom: 1px solid var(--edge); }
  #theory .tabs button {
    background: none; border: 0; border-bottom: 2px solid transparent;
    color: var(--chalk-faint); font: 600 11px/1 var(--mono);
    letter-spacing: .14em; text-transform: uppercase; padding: 8px 12px 10px;
  }
  #theory .tabs button.on { color: var(--amber); border-bottom-color: var(--amber); }
  #theory .tabs .spacer { flex: 1; }
  #theory .tabs .btn { margin-bottom: 6px; }
  #texedit { flex: 1; background: none; border: 0; outline: none; resize: none;
             color: var(--chalk); font: 12.5px/1.7 var(--mono); padding: 16px 18px; display: none; }
  #pdfview { flex: 1; border: 0; background: #efece3; display: none; }
  #texlog { flex: none; max-height: 130px; overflow-y: auto; border-top: 1px dashed var(--edge-soft);
            font: 11px/1.5 var(--mono); color: var(--red); padding: 8px 14px; display: none; white-space: pre-wrap; }
  #rail .railbtn { margin: 8px 16px 4px; }
  #rail .empty { padding: 10px 16px; color: var(--chalk-ghost); font: italic 13px/1.5 var(--serif); white-space: normal; }

  footer {
    flex: none; display: flex; gap: 18px; align-items: center;
    background: var(--slate-2); border-top: 1px solid var(--edge);
    padding: 6px 16px; font: 10.5px/1 var(--mono); color: var(--chalk-ghost);
  }
  footer .amber { color: var(--amber); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <span class="brand"><i>▮</i> Blackboard</span>
  <nav>
    <button id="nav-board" class="on">board</button>
    <button id="nav-chat">assistant</button>
  </nav>
  <span class="path" id="whichnb">no notebook loaded</span>
  <span id="savestate">all saved</span>
  <span id="kstate">kernel idle</span>
  <button class="btn" id="resetk" title="clear the namespace">reset kernel</button>
  <button class="btn" id="runall">run all</button>
  <button class="btn amber" id="saveall">save</button>
</header>

<main>
  <nav id="rail">
    <div class="hd">workspace</div>
    <button class="btn amber railbtn" id="newboard">+ new board</button>
    <div id="tree">loading…</div>
  </nav>

  <section id="board">
    <div class="addrow">
      <button class="btn" id="addcode">+ code</button>
      <button class="btn" id="addmd">+ note</button>
    </div>
  </section>

  <section id="chatview">
    <div id="chatlog"></div>
    <div id="chatbar">
      <textarea id="chatinput" rows="2" placeholder="ask about your code, tex, math… (Enter sends, Shift+Enter = newline)"></textarea>
      <label><input type="checkbox" id="attachboard" checked> attach board</label>
      <button class="btn amber" id="chatsend">send</button>
    </div>
  </section>

  <aside id="theory">
    <div class="tabs">
      <button id="tab-edit" class="on">board · tex</button>
      <button id="tab-pdf">preview</button>
      <span class="spacer"></span>
      <button class="btn amber" id="compile">compile</button>
    </div>
    <textarea id="texedit" spellcheck="false" placeholder="open a .tex from the rail — the theory board lives here"></textarea>
    <iframe id="pdfview" title="compiled theory board"></iframe>
    <div id="texlog"></div>
  </aside>
</main>

<footer>
  <span id="rootpath">root: …</span>
  <span class="amber" id="texpath">no tex open</span>
</footer>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const api = async (path, body) => {
  const res = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
  return res.json();
};

let notebookPath = null, texPath = null;

/* ---------- kernel state ---------- */
let busy = 0;
const kstate = (delta) => {
  busy += delta;
  $("kstate").textContent = busy > 0 ? "kernel busy…" : "kernel idle";
  $("kstate").classList.toggle("busy", busy > 0);
};

/* ---------- cells ---------- */
const board = $("board");
const autosize = (ta) => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; };

/* editor smarts: auto-indent on Enter (extra level after ':'), Tab indents */
function smartKeys(ta, type, cell) {
  ta.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && e.shiftKey && type === "code") {
      e.preventDefault(); runCell(cell); return;
    }
    if (type !== "code") return;
    const { selectionStart: s, selectionEnd: eEnd, value } = ta;
    const insert = (text) => {
      ta.setRangeText(text, s, eEnd, "end");
      ta.dispatchEvent(new Event("input"));
    };
    if (e.key === "Tab") {
      e.preventDefault();
      const lineStart = value.lastIndexOf("\n", s - 1) + 1;
      if (e.shiftKey) {
        const strip = Math.min(4, (value.slice(lineStart).match(/^ */) || [""])[0].length);
        if (strip > 0) {
          ta.setRangeText("", lineStart, lineStart + strip, "end");
          ta.selectionStart = ta.selectionEnd = Math.max(lineStart, s - strip);
          ta.dispatchEvent(new Event("input"));
        }
      } else insert("    ");
    } else if (e.key === "Enter") {
      e.preventDefault();
      const lineStart = value.lastIndexOf("\n", s - 1) + 1;
      const line = value.slice(lineStart, s);
      let indent = (line.match(/^ */) || [""])[0];
      if (/[:({[]\s*$/.test(line)) indent += "    ";
      else if (/^\s*(return|break|continue|pass|raise)\b/.test(line))
        indent = indent.slice(0, Math.max(0, indent.length - 4));
      insert("\n" + indent);
    }
  });
}

async function fixCell(cell) {
  const ta = cell.querySelector("textarea");
  cell.querySelector(".diag")?.remove();
  try {
    const r = await api("/api/fix", { code: ta.value });
    if (r.code !== ta.value) { ta.value = r.code; autosize(ta); markDirty(); }
    if (r.diagnostics.length) {
      const diag = document.createElement("div");
      diag.className = "diag";
      diag.innerHTML = r.diagnostics.slice(0, 8)
        .map((d) => `<b>${d.code || "?"}</b> line ${d.line}: ${escapeHtml(d.message)}`)
        .join("<br>");
      cell.append(diag);
    }
  } catch (err) { alert("fix failed: " + (err.message || err)); }
}

const escapeHtml = (s) => s.replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function makeCell(type, source) {
  const cell = document.createElement("div");
  cell.className = "cell" + (type === "markdown" ? " md" : "");
  cell.dataset.type = type;
  const head = document.createElement("div");
  head.className = "head";
  const tag = document.createElement("span");
  tag.className = "tag"; tag.textContent = type === "code" ? "code" : "note";
  head.append(tag);
  if (type === "code") {
    const run = document.createElement("button");
    run.textContent = "run ▸";
    run.onclick = () => runCell(cell);
    const fixBtn = document.createElement("button");
    fixBtn.textContent = "fix";
    fixBtn.title = "ruff format + safe autofixes";
    fixBtn.onclick = () => fixCell(cell);
    head.append(run, fixBtn);
  }
  const up = document.createElement("button"); up.textContent = "↑";
  up.onclick = () => { cell.previousElementSibling?.before(cell); markDirty(); };
  const down = document.createElement("button"); down.textContent = "↓";
  down.onclick = () => { if (cell.nextElementSibling !== addrow) { cell.nextElementSibling?.after(cell); markDirty(); } };
  const del = document.createElement("button"); del.textContent = "✕";
  del.onclick = () => { cell.remove(); markDirty(); };
  head.append(up, down, del);

  const ta = document.createElement("textarea");
  ta.value = source || ""; ta.spellcheck = false; ta.rows = 1;
  ta.addEventListener("input", () => { autosize(ta); markDirty(); });
  smartKeys(ta, type, cell);
  cell.append(head, ta);
  requestAnimationFrame(() => autosize(ta));
  return cell;
}

const addrow = board.querySelector(".addrow");
const addCell = (type, source) => { const c = makeCell(type, source); addrow.before(c); return c; };
$("addcode").onclick = () => addCell("code", "").querySelector("textarea").focus();
$("addmd").onclick = () => addCell("markdown", "").querySelector("textarea").focus();

async function runCell(cell) {
  const ta = cell.querySelector("textarea");
  cell.querySelector(".out")?.remove();
  cell.classList.add("running"); kstate(1);
  try {
    const r = await api("/api/execute", { code: ta.value });
    const out = document.createElement("div");
    out.className = "out" + (r.ok ? "" : " err");
    let text = (r.stdout || "") + (r.value ? (r.stdout ? "\n" : "") + r.value : "");
    if (!r.ok) text += (text ? "\n" : "") + r.error;
    out.textContent = text;
    for (const b64 of r.images || []) {
      const img = document.createElement("img");
      img.src = "data:image/png;base64," + b64;
      out.append(img);
    }
    if (text || (r.images || []).length) cell.append(out);
  } catch (err) {
    const out = document.createElement("div");
    out.className = "out err"; out.textContent = String(err);
    cell.append(out);
  } finally { cell.classList.remove("running"); kstate(-1); }
}

$("runall").onclick = async () => {
  for (const cell of board.querySelectorAll(".cell")) {
    if (cell.dataset.type === "code") await runCell(cell);
  }
};
$("resetk").onclick = async () => { kstate(1); try { await api("/api/reset", {}); } finally { kstate(-1); } };

/* ---------- files rail ---------- */
function renderTree(nodes, depth) {
  const frag = document.createDocumentFragment();
  for (const node of nodes) {
    const div = document.createElement("div");
    div.className = "node" + (node.dir ? " dir" : "");
    div.style.paddingLeft = 16 + depth * 12 + "px";
    div.textContent = (node.dir ? "▾ " : "· ") + node.name;
    div.dataset.path = node.path;
    frag.append(div);
    if (node.dir && node.children) frag.append(renderTree(node.children, depth + 1));
    if (!node.dir) div.onclick = () => openFile(node.path, div);
  }
  return frag;
}

async function loadWorkspace() {
  const ws = await api("/api/workspace");
  $("rootpath").textContent = "root: " + ws.root;
  const tree = $("tree");
  tree.textContent = "";
  if (!ws.tree.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "an empty slate — start a new board above";
    tree.append(empty);
    return;
  }
  tree.append(renderTree(ws.tree, 0));
}

$("newboard").onclick = async () => {
  const name = prompt("Board name:");
  if (!name) return;
  try {
    const created = await api("/api/board", { name });
    await loadWorkspace();
    const node = [...document.querySelectorAll("#rail .node")]
      .find((n) => n.dataset.path === created.notebook);
    await openFile(created.notebook, node);
    const texNode = [...document.querySelectorAll("#rail .node")]
      .find((n) => n.dataset.path === created.tex);
    const file = await api("/api/file?path=" + encodeURIComponent(created.tex));
    texPath = created.tex;
    $("texpath").textContent = created.tex;
    $("texedit").value = file.content;
    node?.classList.add("on");
  } catch (err) { alert(err.message || err); }
};

async function openFile(path, node) {
  await saveAll();  // never lose unsaved work when switching files
  document.querySelectorAll("#rail .node.on").forEach((n) => n.classList.remove("on"));
  node?.classList.add("on");
  if (path.endsWith(".ipynb")) {
    const nb = await api("/api/notebook?path=" + encodeURIComponent(path));
    notebookPath = path;
    $("whichnb").textContent = path;
    board.querySelectorAll(".cell").forEach((c) => c.remove());
    for (const cell of nb.cells) addCell(cell.type, cell.source);
  } else if (path.endsWith(".tex")) {
    const file = await api("/api/file?path=" + encodeURIComponent(path));
    texPath = path;
    $("texpath").textContent = path;
    $("texedit").value = file.content;
    showTab("edit");
  } else {
    const file = await api("/api/file?path=" + encodeURIComponent(path));
    notebookPath = null;
    $("whichnb").textContent = path + " (read-only view)";
    board.querySelectorAll(".cell").forEach((c) => c.remove());
    addCell("code", file.content);
  }
}

/* ---------- theory board ---------- */
function showTab(which) {
  $("tab-edit").classList.toggle("on", which === "edit");
  $("tab-pdf").classList.toggle("on", which === "pdf");
  $("texedit").style.display = which === "edit" ? "block" : "none";
  $("pdfview").style.display = which === "pdf" ? "block" : "none";
}
$("tab-edit").onclick = () => showTab("edit");
$("tab-pdf").onclick = () => showTab("pdf");
showTab("edit");

$("compile").onclick = async () => {
  if (!texPath) return;
  $("texlog").style.display = "none";
  await api("/api/file", { path: texPath, content: $("texedit").value });
  $("compile").textContent = "compiling…";
  try {
    const r = await api("/api/compile", { path: texPath });
    if (r.ok) {
      $("pdfview").src = r.pdf + "&t=" + Date.now();
      showTab("pdf");
    } else {
      $("texlog").textContent = r.log;
      $("texlog").style.display = "block";
    }
  } finally { $("compile").textContent = "compile"; }
};

/* ---------- save & autosave ---------- */
let dirty = false, saveTimer = null, saving = Promise.resolve();

function markDirty() {
  dirty = true;
  $("savestate").textContent = "unsaved…";
  $("savestate").classList.add("dirty");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveAll(), 1200);
}

async function saveAll() {
  clearTimeout(saveTimer);
  if (!dirty) return saving;
  dirty = false;
  saving = (async () => {
    const jobs = [];
    if (notebookPath) {
      const cells = [...board.querySelectorAll(".cell")].map((c) => ({
        type: c.dataset.type, source: c.querySelector("textarea").value,
      }));
      jobs.push(api("/api/notebook", { path: notebookPath, cells }));
    }
    if (texPath) jobs.push(api("/api/file", { path: texPath, content: $("texedit").value }));
    try {
      await Promise.all(jobs);
      if (!dirty) {
        $("savestate").textContent = "all saved";
        $("savestate").classList.remove("dirty");
      }
    } catch (err) {
      dirty = true;
      $("savestate").textContent = "save failed — retrying";
      setTimeout(() => saveAll(), 3000);
    }
  })();
  return saving;
}

$("saveall").onclick = async () => {
  dirty = true;
  await saveAll();
  $("saveall").textContent = "saved ✓";
  setTimeout(() => ($("saveall").textContent = "save"), 1200);
};

$("texedit").addEventListener("input", markDirty);
window.addEventListener("beforeunload", (e) => {
  if (dirty) { saveAll(); e.preventDefault(); e.returnValue = ""; }
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") saveAll();
});

/* ---------- assistant ---------- */
const chatMessages = [];  // [{role, content}] — browser owns the history

function showView(which) {
  $("nav-board").classList.toggle("on", which === "board");
  $("nav-chat").classList.toggle("on", which === "chat");
  $("board").style.display = which === "board" ? "flex" : "none";
  $("chatview").style.display = which === "chat" ? "flex" : "none";
  if (which === "chat") $("chatinput").focus();
}
$("nav-board").onclick = () => showView("board");
$("nav-chat").onclick = () => showView("chat");

function boardContext() {
  const parts = [];
  if (notebookPath) {
    const cells = [...board.querySelectorAll(".cell")].map((c, i) =>
      `## cell ${i + 1} (${c.dataset.type})\n${c.querySelector("textarea").value}`);
    parts.push(`# Notebook: ${notebookPath}\n\n${cells.join("\n\n")}`);
  }
  if (texPath) parts.push(`# Theory board: ${texPath}\n\n${$("texedit").value}`);
  return parts.join("\n\n---\n\n") || null;
}

/* render assistant text: fenced code blocks become insertable panels */
function renderAssistant(el, text) {
  el.textContent = "";
  const re = /```(\w*)\n([\s\S]*?)(?:```|$)/g;
  let last = 0, m;
  const addText = (t) => {
    if (!t) return;
    const span = document.createElement("div");
    span.className = "txt"; span.textContent = t;
    el.append(span);
  };
  while ((m = re.exec(text)) !== null) {
    addText(text.slice(last, m.index).trim());
    const [, lang, code] = m;
    const blockEl = document.createElement("div");
    blockEl.className = "codeblock";
    const pre = document.createElement("pre"); pre.textContent = code.trimEnd();
    const bar = document.createElement("div"); bar.className = "cbbar";
    const langEl = document.createElement("span");
    langEl.className = "lang"; langEl.textContent = lang || "code";
    const toCell = document.createElement("button");
    toCell.textContent = "→ insert as cell";
    toCell.onclick = () => {
      addCell(lang === "latex" || lang === "tex" ? "markdown" : "code", code.trimEnd());
      markDirty(); showView("board");
    };
    const copy = document.createElement("button");
    copy.textContent = "copy";
    copy.onclick = () => navigator.clipboard.writeText(code.trimEnd());
    bar.append(langEl, toCell, copy);
    blockEl.append(pre, bar);
    el.append(blockEl);
    last = re.lastIndex;
  }
  addText(text.slice(last).trim());
}

async function sendChat() {
  const input = $("chatinput");
  const question = input.value.trim();
  if (!question) return;
  input.value = "";
  chatMessages.push({ role: "user", content: question });

  const log = $("chatlog");
  const userEl = document.createElement("div");
  userEl.className = "msg user"; userEl.textContent = question;
  const asEl = document.createElement("div");
  asEl.className = "msg assistant"; asEl.textContent = "…";
  log.append(userEl, asEl);
  log.scrollTop = log.scrollHeight;
  $("chatsend").disabled = true;

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages: chatMessages,
        context: $("attachboard").checked ? boardContext() : null,
      }),
    });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let full = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      full += decoder.decode(value, { stream: true });
      asEl.textContent = full;  // fast path while streaming
      log.scrollTop = log.scrollHeight;
    }
    renderAssistant(asEl, full);  // final render with insertable code blocks
    chatMessages.push({ role: "assistant", content: full });
  } catch (err) {
    asEl.remove();
    chatMessages.pop();  // failed turn: keep history consistent
    const errEl = document.createElement("div");
    errEl.className = "msg err";
    errEl.textContent = String(err.message || err);
    log.append(errEl);
  } finally {
    $("chatsend").disabled = false;
    log.scrollTop = log.scrollHeight;
  }
}

$("chatsend").onclick = sendChat;
$("chatinput").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); }
});

/* ---------- boot ---------- */
loadWorkspace();
</script>

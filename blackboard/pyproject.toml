[project]
name = "blackboard"
version = "0.1.0"
description = "Blackboard — the MLR research studio: notebook, theory board, and tracker in one room"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "nbformat>=5.9",
    "ruff>=0.6",
    "anthropic>=0.40",
    "openai>=1.50",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]

[project.scripts]
blackboard = "blackboard.server:main"

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blackboard"]

[project]
name = "mlr"
version = "0.1.0"
description = "Personal ML research library: models, experiments, tracking, papers"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "typer>=0.12",
    "rich>=13.0",
    "questionary>=2.0",
]

[project.optional-dependencies]
torch = ["torch>=2.4"]
dev = ["pytest>=8.0", "ipykernel>=6.0"]

[project.scripts]
mlr = "mlr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
